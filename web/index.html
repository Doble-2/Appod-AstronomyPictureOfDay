    <style id="splash-screen-style">
      @font-face {
        font-family: "Nasa";
        src: url("assets/assets/nasalization-rg.ttf") format("truetype");
        font-display: block;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0a0c10;
      }
      .splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0c10;
        transition: opacity 320ms ease, transform 320ms ease;
      }
      .splash.fade-out {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .splash-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #5e9eff;
        animation: splash-in 500ms ease-out both;
      }
      .splash-mark {
        width: 34px;
        height: 34px;
        display: block;
      }
      .splash-name {
        font: 40px "Nasa", system-ui, sans-serif;
        line-height: 1;
      }
      .splash-track {
        width: 120px;
        height: 2px;
        margin-top: 26px;
        overflow: hidden;
        border-radius: 1px;
        background: rgba(255, 255, 255, 0.1);
        animation: splash-in 500ms 120ms ease-out both;
      }
      .splash-track::before {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 1px;
        background: linear-gradient(90deg, #3391ff, #00c6b5);
        animation: splash-slide 1.2s ease-in-out infinite;
      }
      .splash-credit {
        position: absolute;
        bottom: max(28px, env(safe-area-inset-bottom));
        font: 12px system-ui, -apple-system, sans-serif;
        color: #7c8491;
        text-decoration: none;
        animation: splash-in 500ms 200ms ease-out both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-brand,
        .splash-track,
        .splash-credit,
        .splash-track::before {
          animation: none;
        }
        .splash-track::before {
          width: 100%;
        }
      }
    </style>
    <link rel="preload" href="assets/assets/nasalization-rg.ttf" as="font" type="font/ttf" crossorigin />
    <script id="splash-screen-script">
      // Old links used /#/apod/...; the app now uses clean addresses.
      if (location.hash.startsWith("#/")) {
        history.replaceState(null, "", location.hash.slice(1));
      }
      function removeSplashFromWeb() {
        const s = document.getElementById("custom-splash");
        if (!s) return;
        s.classList.add("fade-out");
        setTimeout(() => {
          s.remove();
        }, 320);
      }
      // Hide as soon as Flutter has drawn its first frame.
      window.addEventListener("flutter-first-frame", removeSplashFromWeb);
      // Fallback si Flutter tarda demasiado
      setTimeout(() => {
        removeSplashFromWeb();
      }, 8000);
    </script>
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
      name="viewport"
    />
  </head>
  <body>
    <div id="custom-splash" class="splash" role="img" aria-label="APPOD">
      <div class="splash-brand">
        <span class="splash-name">APPOD</span>
        <svg class="splash-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <rect x="2.5" y="8.5" width="13" height="13" rx="1" />
          <rect x="8.5" y="2.5" width="13" height="13" rx="3.5" />
        </svg>
      </div>
      <div class="splash-track"></div>
      <a class="splash-credit" href="https://angelcalderon.dev" target="_blank" rel="noopener">by angelcalderon.dev</a>
    </div>
    <script src="flutter_bootstrap.js" async></script>
